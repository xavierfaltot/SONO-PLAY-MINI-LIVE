<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SONO PLAY MINI LIVE — CONTROL</title><style>:root{--bg:#090909;--fg:#f2ead9;--red:#ef392f;--gold:#c9a34a;--dim:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px;line-height:.9}.live{color:var(--red);font-weight:900}.card{border:1px solid #292929;border-radius:18px;padding:18px;margin:12px 0;background:#0e0e0e}.label{font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:800}.track{font-size:18px;font-weight:800;margin:8px 0;word-break:break-word}.stats{display:flex;gap:18px;color:var(--gold);font-weight:800}.drop{display:block;border:2px dashed #333;border-radius:14px;padding:30px 12px;text-align:center;cursor:pointer}.drop.drag{border-color:var(--red)}input[type=file]{display:none}button{background:var(--red);color:white;border:0;border-radius:999px;padding:13px 18px;font-weight:900;margin-top:12px}.status{margin-top:10px;color:var(--gold)}pre{height:310px;overflow:auto;background:#050505;border-radius:12px;padding:12px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:#cfcfcf}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:7px}@media(max-width:520px){.wrap{padding:12px}.card{border-radius:14px;padding:14px}pre{height:40vh}}</style></head><body><main class="wrap"><div class="head"><div class="brand">SONO<br>PLAY MINI <span style="color:var(--gold)">LIVE</span></div><div class="live"><span class="dot"></span>CONTROL</div></div><section class="card"><div class="label">ON AIR</div><div id="track" class="track">Connexion…</div><div class="stats"><span id="bpm">BPM —</span><span id="energy">ENERGY —</span><span id="pos">—</span></div></section><section class="card"><div class="label">DROP NEW TRACKS</div><form id="up"><label id="drop" class="drop" for="files"><strong>DROP MP3 HERE</strong><br><span style="color:#777">ou toucher pour sélectionner</span></label><input id="files" name="tracks[]" type="file" accept="audio/mpeg,.mp3" multiple><button>UPLOAD</button><div id="uploadStatus" class="status"></div></form></section><section class="card"><div class="label">LIVE CONSOLE</div><pre id="console">Connexion console…</pre></section></main><script>const API='../index.php?action=now';async function now(){try{let r=await fetch(API,{cache:'no-store'}),j=await r.json(),c=j.current||{};track.textContent=c.file||'—';bpm.textContent='BPM '+(c.bpm??'UNKNOWN');energy.textContent='ENERGY '+(c.energy??'—');pos.textContent=Math.floor(c.position||0)+'s';}catch(e){track.textContent='API OFFLINE'}}now();setInterval(now,5000);const d=document.getElementById('drop'),f=document.getElementById('files');['dragenter','dragover'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>{f.files=e.dataTransfer.files});document.getElementById('up').onsubmit=async e=>{e.preventDefault();if(!f.files.length)return;let fd=new FormData();[...f.files].forEach(x=>fd.append('tracks[]',x));uploadStatus.textContent='UPLOAD…';try{let r=await fetch('upload.php',{method:'POST',body:fd}),j=await r.json();uploadStatus.textContent=j.ok?'READY — '+j.files.length+' track(s)':'ERROR — '+(j.error||'upload');}catch(x){uploadStatus.textContent='ERROR'}};async function logs(){try{let r=await fetch('console.php',{cache:'no-store'});if(r.ok){let t=await r.text();if(t){console.textContent=t;console.scrollTop=console.scrollHeight}}}catch(e){console.textContent='CONSOLE ENDPOINT NOT CONNECTED'}}logs();setInterval(logs,3000);</script></body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONO PLAY MINI LIVE — SYNC PLAYER V0.2</title>
<style>
:root{--bg:#0a0a0a;--fg:#f3eee4;--muted:#8f8f8f;--line:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px}
h1{font-size:20px;margin:0 0 18px}.clock{font-size:52px;font-weight:700;letter-spacing:-2px;margin:8px 0}.meta{color:var(--muted);font-size:13px;line-height:1.45}.card{border:1px solid var(--line);padding:18px;margin:18px 0}.now{font-size:18px;font-weight:700;word-break:break-word}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}button{background:var(--fg);color:#111;border:0;padding:12px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}progress{width:100%;height:14px}.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.kpi div{border-top:1px solid var(--line);padding-top:8px}.kpi b{display:block;font-size:18px}.small{font-size:11px;color:var(--muted)}@media(max-width:600px){.clock{font-size:38px}.kpi{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<h1>SONO PLAY MINI LIVE — SYNC PLAYER V0.2</h1><div class="clock" id="clock">--:--:--</div><div class="meta">Daily reset 06:40 · Europe/Berlin · synchronized virtual radio</div>
<div class="card"><div class="small">NOW PLAYING</div><div class="now" id="track">loading…</div><div class="row"><button id="play" disabled>▶ LISTEN LIVE</button><button id="resync" disabled>↻ RESYNC</button></div><progress id="progress" max="100" value="0"></progress><div class="kpi"><div><span class="small">BPM</span><b id="bpm">—</b></div><div><span class="small">ENERGY</span><b id="energy">—</b></div><div><span class="small">POSITION</span><b id="position">—</b></div><div><span class="small">NEXT</span><b id="nextbpm">—</b></div></div></div>
<div class="meta" id="status">Connecting to scheduler…</div><audio id="audio" preload="auto"></audio></main>
<script>
const API='index.php?action=now';const audio=document.getElementById('audio'),play=document.getElementById('play'),resync=document.getElementById('resync'),status=document.getElementById('status');let state=null,wantedPlaying=false,pollTimer=null;
function fmtSec(s){s=Math.max(0,Number(s)||0);const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+String(ss).padStart(2,'0')}
function tickClock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}setInterval(tickClock,250);tickClock();
async function getState(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}
function paint(s){document.getElementById('track').textContent=s.current?.file||'—';document.getElementById('bpm').textContent=s.current?.bpm??'—';document.getElementById('energy').textContent=s.current?.energy??'—';document.getElementById('position').textContent=fmtSec(s.current?.position);document.getElementById('nextbpm').textContent=s.next?.bpm??'—';document.getElementById('progress').value=s.current?.progress??0;status.textContent=`Loop ${s.loopIndex} · ${s.scheduledTotalCount} tracks · ${s.scheduledSurpriseCount} surprises · next reset ${s.nextDailyReset}`}
async function sync(force=false){try{const s=await getState();state=s;paint(s);play.disabled=false;resync.disabled=false;const url=s.current?.url,pos=Number(s.current?.position||0);if(!url)throw Error('No current track URL');const changed=audio.src!==url&&audio.currentSrc!==url;if(changed){audio.src=url;audio.load();await new Promise(resolve=>{if(audio.readyState>=1)return resolve();const done=()=>{audio.removeEventListener('loadedmetadata',done);resolve()};audio.addEventListener('loadedmetadata',done,{once:true});setTimeout(resolve,6000)});try{audio.currentTime=pos}catch(e){}if(wantedPlaying)await audio.play()}else{const drift=Math.abs((audio.currentTime||0)-pos);if(force||drift>2.5){try{audio.currentTime=pos}catch(e){}}}}catch(e){status.textContent='SYNC ERROR: '+e.message}}
play.onclick=async()=>{wantedPlaying=!wantedPlaying;if(wantedPlaying){try{await sync(true);await audio.play();play.textContent='Ⅱ ON AIR'}catch(e){wantedPlaying=false;play.textContent='▶ LISTEN LIVE';status.textContent='PLAY ERROR: '+e.message}}else{audio.pause();play.textContent='▶ LISTEN LIVE'}};resync.onclick=()=>sync(true);audio.addEventListener('ended',()=>setTimeout(()=>sync(true),250));audio.addEventListener('error',()=>{status.textContent='AUDIO ERROR — resyncing…';setTimeout(()=>sync(true),1200)});pollTimer=setInterval(()=>sync(false),15000);sync(false);
</script></body></html>
